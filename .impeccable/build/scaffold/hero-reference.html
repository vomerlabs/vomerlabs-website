<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: working-index.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kedebideri:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7e9}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1586px">
  <div class="r-page-ground region chrome" data-region="page-ground"><!-- Flat warm off-white page background --></div>
  <div class="r-wordmark region text" data-region="wordmark"><!-- VomerLabs black sans serif wordmark --><p style="font-size:var(--r-wordmark-font);line-height:1.05;margin:0">wordmark</p></div>
  <div class="r-nav-work region control" data-region="nav-work"><!-- Work navigation text link: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-work); a control need not have button chrome --></div>
  <div class="r-nav-studio region control" data-region="nav-studio"><!-- Studio navigation text link: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-studio); a control need not have button chrome --></div>
  <div class="r-nav-contact region control" data-region="nav-contact"><!-- Contact navigation text link: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav-contact); a control need not have button chrome --></div>
  <div class="r-headline region text" data-region="headline"><!-- Ideas into useful things. in two lines of large heavy sans serif type --><p style="font-size:var(--r-headline-font);font-family:var(--r-headline-family),sans-serif;font-weight:var(--r-headline-weight);line-height:1.05;margin:0">headline</p></div>
  <div class="r-introduction region text" data-region="introduction"><!-- VomerLabs is an independent studio where I build software, explore practical uses for AI, and share what I learn. in three lines --><p style="font-size:var(--r-introduction-font);line-height:1.05;margin:0">introduction</p></div>
  <div class="r-contact-button region control" data-region="contact-button"><!-- Soft lime pill control with Get in touch text and a right pointing arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop contact-button); a control need not have button chrome --></div>
  <div class="r-contact-email region control" data-region="contact-email"><!-- hi@vomerlabs.com gray direct email link: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop contact-email); a control need not have button chrome --></div>
  <div class="r-project-rule-top region chrome" data-region="project-rule-top"><!-- Thin gray horizontal rule above featured project --></div>
  <div class="r-project-label region text" data-region="project-label"><!-- FEATURED PROJECT in small spaced metadata type --><p style="font-size:var(--r-project-label-font);line-height:1.05;margin:0">project-label</p></div>
  <div class="r-project-title region text" data-region="project-title"><!-- VomerLabs website in bold black sans serif type --><p style="font-size:var(--r-project-title-font);line-height:1.05;margin:0">project-title</p></div>
  <div class="r-project-description region text" data-region="project-description"><!-- A home for the studio, its projects, and the process behind them. in secondary text --><p style="font-size:var(--r-project-description-font);line-height:1.05;margin:0">project-description</p></div>
  <div class="r-project-status region control" data-region="project-status"><!-- Pale lime status badge with a small green dot and In progress text: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop project-status); a control need not have button chrome --></div>
  <div class="r-metadata-divider region chrome" data-region="metadata-divider"><!-- Thin vertical gray rule dividing status from technical metadata --></div>
  <div class="r-project-metadata region text" data-region="project-metadata"><!-- Astro · Markdown · Plain CSS in quiet monospaced technical metadata --><p style="font-size:var(--r-project-metadata-font);line-height:1.05;margin:0">project-metadata</p></div>
  <div class="r-project-action region control" data-region="project-action"><!-- About this build text link with right arrow and lime underline: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop project-action); a control need not have button chrome --></div>
  <div class="r-project-rule-bottom region chrome" data-region="project-rule-bottom"><!-- Thin gray horizontal rule below featured project --></div>
  <div class="r-studio-heading region text" data-region="studio-heading"><!-- Software, practical AI, and a thoughtful process. in two lines of bold sans serif type --><p style="font-size:var(--r-studio-heading-font);line-height:1.05;margin:0">studio-heading</p></div>
  <div class="r-studio-description region text" data-region="studio-description"><!-- I work at the intersection of software and practical AI, with a focus on real problems, clear thinking, and useful outcomes. This is a space to build, explore, and share what I learn along the way. in readable secondary text --><p style="font-size:var(--r-studio-description-font);line-height:1.05;margin:0">studio-description</p></div>
</main>
</body>
</html>
